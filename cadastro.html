<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Usuário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: slateblue;
            text-align: center;
            color: blanchedalmond;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin-left: 10%;
            margin-right: 10%;
        }

        form {
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin: 0 auto;
        }

        label {
            margin-bottom: 10px;
        }

        input {
            padding: 5px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px;
            background-color: #4caf50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        output {
            margin-top: 20px;
        }

        .error-message {
            color: red;
            margin-top: 5px;
        }

        .success-message {
            color: green;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>Cadastro de Usuário</h1>

<form id="userForm">
    <label for="userName">Nome:</label>
    <input type="text" id="userName" name="userName" required>

    <label for="userEmail">E-mail:</label>
    <input type="email" id="userEmail" name="userEmail" required>
    <span class="error-message" id="emailError"></span>

    <label for="userData">Data de Nascimento:</label>
    <input type="date" id="userData" name="userData" required>

    <label for="userPassword">Senha:</label>
    <input type="password" id="userPassword" name="userPassword" required>

    <label for="userConfirmarPassword">Confirmar Senha:</label>
    <input type="password" id="userConfirmarPassword" name="userConfirmarPassword" required>
    <span class="error-message" id="passwordError"></span>

    <button type="button" onclick="cadastrarUsuario()">Cadastrar</button>
</form>

<div id="output"></div>


<script src="./js/cadastro.js"></script>
</body>
</html>
